<label class="box">
  <input type="file" [accept]="accept()" (change)="pick($event)" />
  <!-- ไอคอนรูปภาพ (Figma) -->
  <svg class="ico" width="36" height="36" viewBox="0 0 36 36" fill="none" aria-hidden="true">
    <rect x="3.5" y="3.5" width="29" height="29" rx="7" stroke="currentColor" stroke-width="1.8" />
    <circle cx="13" cy="13" r="3" stroke="currentColor" stroke-width="1.8" />
    <path d="M4 27l8.5-8.5a2 2 0 0 1 2.8 0L26 29M21 23.5l2.7-2.7a2 2 0 0 1 2.8 0L32 26.3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
  </svg>
  @if (value()) {
    <strong class="file" [attr.title]="value()">{{ value() }}</strong>
    <button type="button" class="remove" (click)="clear($event)">ลบไฟล์</button>
  } @else {
    @if (label()) {
      <span class="text">{{ label() }}</span>
    }
    @if (spec()) {
      <span class="text">{{ spec() }}</span>
    }
  }
  @if (error) {
    <span class="err">{{ error }}</span>
  }
</label>
