<header class="topbar">
  <button type="button" class="burger" aria-label="เปิด/ย่อเมนู" (click)="layout.toggleSidebar()">
    <img [src]="asset + 'burger.svg'" width="17.5" height="13.5" alt="" />
  </button>

  <h1 class="title">{{ title() }}</h1>

  <div class="right switcher-anchor">
    <button type="button" class="bell" aria-label="การแจ้งเตือน">
      <img [src]="asset + 'notification.svg'" width="24" height="24" alt="" />
      @if (notificationCount() > 0) {
        <span class="bell-badge">{{ badgeText() }}</span>
      }
    </button>

    @if (dataSource.source() === 'tesla') {
      <button type="button" class="source-badge" title="แหล่งข้อมูล: Tesla Admin API (PostgreSQL)" (click)="toggleSwitcher()">Tesla API</button>
    }

    <button type="button" class="role-badge" (click)="toggleSwitcher()" [attr.aria-expanded]="switcherOpen()">
      Role: {{ session.roleLabel() }}
    </button>

    <div class="user">
      <span class="user-name">{{ session.user()?.userName ?? 'User name' }}</span>
      <span class="user-pos">{{ session.user()?.position ?? '' }}</span>
    </div>

    <button type="button" class="profile" aria-label="เมนูผู้ใช้" (click)="toggleSwitcher()">
      <span class="avatar">{{ session.initial() }}</span>
      <img class="caret" [src]="asset + 'caret-down.svg'" width="11.0667" height="6.06667" alt="" />
    </button>

    @if (switcherOpen()) {
      <app-role-switcher (closed)="switcherOpen.set(false)" />
    }
  </div>
</header>
