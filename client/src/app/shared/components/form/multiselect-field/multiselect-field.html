<ng-template #field>
  <p-multiselect
    [inputId]="id"
    [options]="options()"
    [optionLabel]="optionLabel()"
    [optionValue]="optionValue()"
    [ngModel]="value()"
    (ngModelChange)="change($event)"
    (onBlur)="touch()"
    [filter]="filter()"
    [showToggleAll]="true"
    display="chip"
    [disabled]="isDisabled()"
    [placeholder]="label() ? undefined : placeholder() || undefined"
    [fluid]="true"
    appendTo="body"
    emptyMessage="ไม่มีตัวเลือก"
    emptyFilterMessage="ไม่พบข้อมูล"
  />
</ng-template>

@if (label()) {
  <p-floatlabel variant="in">
    <ng-container *ngTemplateOutlet="field" />
    <label [for]="id">{{ label() }}@if (required()) { <span class="req">*</span> }</label>
  </p-floatlabel>
} @else {
  <ng-container *ngTemplateOutlet="field" />
}
