<svg
  [attr.width]="size()"
  [attr.height]="size()"
  viewBox="0 0 24 24"
  fill="none"
  stroke="currentColor"
  [attr.stroke-width]="strokeWidth()"
  stroke-linecap="round"
  stroke-linejoin="round"
  aria-hidden="true"
>
  @switch (name()) {
    @case ('overview') {
      <svg:rect x="3" y="3" width="7" height="9" rx="1.5" />
      <svg:rect x="14" y="3" width="7" height="5" rx="1.5" />
      <svg:rect x="14" y="12" width="7" height="9" rx="1.5" />
      <svg:rect x="3" y="16" width="7" height="5" rx="1.5" />
    }
    @case ('content') {
      <svg:path d="M6 3h8l4 4v14H6z" />
      <svg:path d="M14 3v4h4" />
      <svg:path d="M9 12h6M9 16h6" />
    }
    @case ('campaign') {
      <svg:path d="M3 12V4h8l10 10-8 8z" />
      <svg:circle cx="7.5" cy="7.5" r="1.5" />
    }
    @case ('people') {
      <svg:circle cx="9" cy="8" r="3.5" />
      <svg:path d="M2.5 20c.8-3.6 3.4-5.5 6.5-5.5s5.7 1.9 6.5 5.5" />
      <svg:circle cx="17" cy="9" r="2.5" />
      <svg:path d="M16.5 14.6c2.6.2 4.4 1.9 5 4.9" />
    }
    @case ('master') {
      <svg:ellipse cx="12" cy="5.5" rx="8" ry="2.5" />
      <svg:path d="M4 5.5v13c0 1.4 3.6 2.5 8 2.5s8-1.1 8-2.5v-13" />
      <svg:path d="M4 12c0 1.4 3.6 2.5 8 2.5s8-1.1 8-2.5" />
    }
    @case ('menu') {
      <svg:path d="M4 7h16M4 12h16M4 17h16" />
    }
    @case ('bell') {
      <svg:path d="M6 9a6 6 0 0 1 12 0c0 6 2.5 7.5 2.5 7.5h-17S6 15 6 9z" />
      <svg:path d="M10 20a2 2 0 0 0 4 0" />
    }
    @case ('home') {
      <svg:path d="M4 11l8-7 8 7v9H4z" />
    }
    @case ('chevron-down') {
      <svg:path d="M6 9l6 6 6-6" />
    }
    @case ('chevron-right') {
      <svg:path d="M9 6l6 6-6 6" />
    }
    @case ('check') {
      <svg:path d="M5 12.5l4.5 4.5L19 7.5" />
    }
    @case ('plus') {
      <svg:path d="M12 5v14M5 12h14" />
    }
    @case ('user-switch') {
      <svg:circle cx="10" cy="8" r="3.5" />
      <svg:path d="M3.5 20c.8-3.6 3.4-5.5 6.5-5.5 1.3 0 2.5.3 3.5.9" />
      <svg:path d="M16 14l-2 2 2 2M14 16h7M19 20l2-2" />
    }
    @case ('info') {
      <svg:circle cx="12" cy="12" r="9" />
      <svg:path d="M12 11v5M12 8h.01" />
    }
  }
</svg>
